default: &default
  adapter: postgresql
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: audio_predictive_maintenance_development

test:
  <<: *default
  database: audio_predictive_maintenance_test
  username: postgres
  password: password
  host: 127.0.0.1
  port: 5432

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB") { "draw_poker_production" } %>
  username: <%= ENV.fetch("POSTGRES_USER") { "postgres" } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { "dummy_password_for_build" } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: 5432
