name: Production Telemetry Build Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # The Docker builder layer handles compilation natively, safely isolated from GitHub runner bugs
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Authenticate with GitHub Packages Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}

    - name: Build and Push Slim Container Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ghcr.io/ctballentine/audio-predictive-maintenance-demo:latest
        platforms: linux/amd64
        cache-from: type=gha
        cache-to: type=gha,mode=max
